<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHD Akademi — ders motoru</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <div id="stage">
    <svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="sub"><span></span></div>
    <pre id="debug"></pre>
  </div>
</div>
<div id="panel">
  <button id="bPlay" title="Oynat / durdur (Boşluk)">▶</button>
  <button id="bRestart" title="Başa sar (R)">⟲</button>
  <div id="seekwrap"><input id="seek" type="range" min="0" max="100" step="0.01" value="0"><div id="marks"></div></div>
  <span id="tlabel">0:00 / 0:00</span>
  <span id="slabel"></span>
  <button id="bSfx" class="on" title="Ses efektleri (M)">SFX</button>
  <button id="bSubs" title="Altyazı (C)">Altyazı</button>
  <button id="bDebug" title="Debug / kelime zamanları (D)">Debug</button>
  <button id="bFs" title="Tam ekran (F)">⛶</button>
</div>
<script src="src/util.js"></script>
<script src="src/text.js"></script>
<script src="src/graph.js"></script>
<script src="src/graph3u.js"></script>
<script src="src/board.js"></script>
<script src="src/sfx.js"></script>
<script src="math_cache.js"></script>
<script>document.write('<script src="' + (new URLSearchParams(location.search).get('words') || 'timing/words.js') + '"><\/script>')</script>
<script>document.write('<script src="' + (new URLSearchParams(location.search).get('lesson') || 'lesson_full') + '.js"><\/script>')</script>
<script src="src/main.js"></script>
</body>
</html>
